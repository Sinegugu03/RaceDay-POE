name: Validate Repository Structure

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-structure:
    name: Validate /docs folder and required files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::/docs folder is missing from the repository root."
            exit 1
          fi
          echo "/docs folder found."
          echo "Contents of /docs:"
          ls -la docs/

      - name: Check for ERD file (PNG or PDF)
        run: |
          MATCH=$(find docs -maxdepth 1 -iname "*.png" -o -iname "*.pdf" 2>/dev/null)
          if [ -z "$MATCH" ]; then
            echo "::error::No ERD image (.png or .pdf) found in /docs."
            exit 1
          fi
          echo "ERD file found:"
          echo "$MATCH"

      - name: Check for endpoint plan (PDF or Markdown)
        run: |
          MATCH=$(find docs -maxdepth 1 -iname "*.md" -o -iname "*.pdf" 2>/dev/null)
          if [ -z "$MATCH" ]; then
            echo "::error::No endpoint plan (.md or .pdf) found in /docs."
            exit 1
          fi
          echo "Endpoint plan file found:"
          echo "$MATCH"

      - name: Check for SQL script
        run: |
          MATCH=$(find docs -maxdepth 1 -iname "*.sql" 2>/dev/null)
          if [ -z "$MATCH" ]; then
            echo "::error::No SQL script (.sql) found in /docs."
            exit 1
          fi
          echo "SQL script found:"
          echo "$MATCH"

      - name: Check for README
        run: |
          MATCH=$(find . -maxdepth 1 -iname "README.md" 2>/dev/null)
          if [ -z "$MATCH" ]; then
            echo "::error::README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All checks passed
        run: echo "Repository structure is valid. All required files are present."
